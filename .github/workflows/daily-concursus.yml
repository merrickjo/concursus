name: Daily Concursus

on:
  schedule:
    - cron: '0 22 * * *'  # 05:00 WIB (UTC+7) = 22:00 UTC previous day
  workflow_dispatch:      # allow manual trigger

jobs:
  roll-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Roll d20 and call n8n webhook
        run: |
          ROLL=$((RANDOM % 20 + 1))
          echo "Today's roll: $ROLL"
          curl -s -X POST https://narrowbot.app.n8n.cloud/webhook/concursus \
            -H "Content-Type: application/json" \
            -d "{\"roll\": $ROLL}"
